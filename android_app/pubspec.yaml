name: ps4_theme_builder
description: Android companion for creating and organizing personal PS4 theme projects.
publish_to: 'none'
version: 0.1.0+1
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  file_picker: ^10.3.7
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  archive: ^4.0.7
  just_audio: ^0.10.5
  share_plus: ^12.0.1
  cupertino_icons: ^1.0.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
