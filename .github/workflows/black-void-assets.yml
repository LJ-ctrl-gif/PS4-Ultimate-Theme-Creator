name: BLACK VOID Artwork Assets

on:
  push:
    paths:
      - "tools/prepare_black_void_assets.py"
      - ".github/workflows/black-void-assets.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-artwork:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image processing dependency
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Download and prepare BLACK VOID PNG assets
        run: python tools/prepare_black_void_assets.py
      - name: Upload prepared artwork
        uses: actions/upload-artifact@v4
        with:
          name: BLACK-VOID-artwork-assets
          path: BLACK_VOID_ASSETS/
          if-no-files-found: error
          retention-days: 14
