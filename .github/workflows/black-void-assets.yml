name: BLACK VOID Artwork Assets

on:
  push:
    paths:
      - "tools/prepare_black_void_assets.py"
      - ".github/workflows/black-void-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-artwork:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image processing dependency
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Download and prepare BLACK VOID PNG assets
        run: python tools/prepare_black_void_assets.py
      - name: Commit prepared PNG assets to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BLACK_VOID_ASSETS/
          if ! git diff --cached --quiet; then
            git commit -m "Add generated BLACK VOID artwork assets"
            git push
          else
            echo "Artwork assets are already up to date."
          fi
      - name: Upload prepared artwork
        uses: actions/upload-artifact@v4
        with:
          name: BLACK-VOID-artwork-assets
          path: BLACK_VOID_ASSETS/
          if-no-files-found: error
          retention-days: 14
