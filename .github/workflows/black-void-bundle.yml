name: BLACK VOID Theme Asset Bundle
on:
  workflow_dispatch:
  push:
    paths:
      - "BLACK_VOID_ASSETS/**"
      - "tools/build_black_void_bundle.py"
      - "tools/validate_black_void_integration.py"
      - "app/**"
      - "tests/**"
      - "README.md"
      - "run-termux.sh"
      - "tools/NOTICE.txt"
      - ".github/workflows/black-void-bundle.yml"
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install -r requirements.txt Pillow
      - name: Check Python syntax
        run: python -m compileall -q app tools
      - name: Check browser JavaScript syntax
        run: node --check app/static/app.js
      - name: Check checksum manifest builder syntax
        run: python -m py_compile tools/build_black_void_bundle.py
      - name: Check Termux launcher shell syntax
        run: bash -n run-termux.sh
      - name: Build canonical theme asset bundle
        run: python tools/build_black_void_bundle.py
      - name: Validate BLACK VOID app integration
        run: python tools/validate_black_void_integration.py
      - name: Test BLACK VOID import and rollback
        run: python -m unittest discover -s tests -p test_black_void_import.py
      - name: Test workspace asset inventory and deletion
        run: python -m unittest discover -s tests -p test_workspace.py
      - name: Test theme source ZIP export
        run: python -m unittest discover -s tests -p test_theme_source_export.py
      - name: Test LAN transfer access boundaries
        run: python -m unittest discover -s tests -p test_lan_transfer.py
      - name: Test PS4 package toolchain preflight
        run: python -m unittest discover -s tests -p test_pkg_toolchain.py
      - name: Validate bundle contents
        run: |
          python - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          path = Path("dist/BLACK-VOID-theme-assets.zip")
          import hashlib
          with ZipFile(path) as archive:
              names = archive.namelist()
              pngs = [name for name in names if name.lower().endswith(".png")]
              assert len(pngs) == 32, f"Expected 32 PNG files, found {len(pngs)}"
              assert "Image0/theme.xml" not in names, "Preset bundle must not pretend to be a complete theme"
              assert "MANIFEST.sha256" in names, "Missing SHA-256 manifest"
              lines = archive.read("MANIFEST.sha256").decode("utf-8").splitlines()
              checks = {}
              for line in lines:
                  digest, member = line.split("  ", 1)
                  assert member not in checks, f"Duplicate manifest entry: {member}"
                  checks[member] = digest
              assert set(checks) == set(pngs), "Manifest does not cover exactly every PNG"
              for member, digest in checks.items():
                  actual = hashlib.sha256(archive.read(member)).hexdigest()
                  assert actual == digest, f"Checksum mismatch: {member}"
          print(f"Validated {len(pngs)} PNG files and SHA-256 checksums in {path.stat().st_size} bytes")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: BLACK-VOID-theme-assets
          path: dist/BLACK-VOID-theme-assets.zip
          retention-days: 14
